<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>비버챌린지 응시코드 조회</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
      color: #162b28;
      background: #edf5f0;
      line-height: 1.55;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(24px, 7vw, 72px) 16px; }
    main { max-width: 520px; margin: 0 auto; }
    header {
      background: #164a3e;
      color: #fff;
      padding: 26px clamp(18px, 5vw, 30px);
      border-radius: 20px 20px 0 0;
    }
    header p { margin: 0 0 5px; color: #d2f2e1; font-size: .94rem; }
    h1 { margin: 0; font-size: clamp(1.4rem, 6vw, 2rem); line-height: 1.3; }
    .panel {
      padding: 24px clamp(18px, 5vw, 30px);
      background: white;
      border: 1px solid #cddfd6;
      border-top: 0;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 12px 32px #143d2710;
    }
    .intro { margin: 0 0 20px; }
    label, dt { display: block; font-weight: 700; }
    label { margin: 14px 0 5px; }
    input, button { font: inherit; min-height: 46px; border-radius: 9px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #819b91;
      background: #fff;
      color: inherit;
    }
    button { padding: 8px 13px; border: 1px solid transparent; cursor: pointer; font-weight: 700; }
    button[type="submit"] { width: 100%; margin-top: 19px; background: #17614c; color: #fff; }
    button[type="submit"]:disabled { opacity: .65; cursor: default; }
    button[type="button"] { background: #fff; border-color: #819b91; color: #164a3e; }
    :focus-visible { outline: 3px solid #2679ae; outline-offset: 3px; }
    #status { margin: 0; }
    #status:not(:empty) { margin-top: 14px; }
    #status.error { color: #9a231a; }
    #result { margin-top: 16px; padding: 15px; border-radius: 12px; background: #edf5f0; }
    h2 { margin: 0 0 10px; font-size: 1.12rem; }
    dl, dd { margin: 0; }
    .credential + .credential { margin-top: 10px; }
    dd { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
    output { user-select: all; font: 600 1.05rem ui-monospace, monospace; overflow-wrap: anywhere; }
    .footer { color: #47605a; font-size: .9rem; margin: 17px 0 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <p>비버챌린지</p>
      <h1>응시코드 조회</h1>
    </header>
    <section class="panel" aria-label="조회 양식">
      <p class="intro">학번과 선생님에게 받은 확인코드를 입력하세요.</p>
      <form id="lookup" method="post" autocomplete="off">
        <label for="student">학번</label>
        <input id="student" type="text" inputmode="numeric" maxlength="4" placeholder="학번 4자리" required>
        <label for="verification">확인코드</label>
        <input id="verification" type="text" inputmode="numeric" maxlength="4" placeholder="확인코드 4자리" required>
        <button type="submit" id="submit" disabled>응시코드 조회</button>
      </form>
      <noscript><p>브라우저에서 자바스크립트를 켜고 다시 열어 주세요.</p></noscript>
      <section id="result" aria-labelledby="result-title" hidden>
        <h2 id="result-title">내 응시코드</h2>
        <dl>
          <div class="credential">
            <dt>응시코드-아이디</dt>
            <dd><output id="exam-id"></output><button type="button" data-copy="exam-id" aria-label="아이디 복사">복사</button></dd>
          </div>
          <div class="credential">
            <dt>응시코드-비밀번호</dt>
            <dd><output id="exam-password"></output><button type="button" data-copy="exam-password" aria-label="비밀번호 복사">복사</button></dd>
          </div>
        </dl>
      </section>
      <p id="status" role="status"></p>
      <p class="footer">개인 조회 링크와 확인코드는 담당 선생님에게 받으세요.</p>
    </section>
  </main>

  <script>
    "use strict";

    const records = JSON.parse(document.getElementById("encrypted-records").textContent);
    const form = document.getElementById("lookup");
    const studentInput = document.getElementById("student");
    const verificationInput = document.getElementById("verification");
    const submit = document.getElementById("submit");
    const result = document.getElementById("result");
    const examId = document.getElementById("exam-id");
    const examPassword = document.getElementById("exam-password");
    const status = document.getElementById("status");
    const subtle = globalThis.crypto?.subtle;
    const encoder = new TextEncoder();
    const linkToken = /^#code=([A-Za-z0-9_-]{22})$/.exec(window.location.hash)?.[1];

    function showStatus(message, error = false) {
      status.textContent = message;
      status.classList.toggle("error", error);
    }

    function clearResult() {
      result.hidden = true;
      examId.textContent = "";
      examPassword.textContent = "";
      showStatus("");
    }

    async function lookupCredentials(student, verification) {
      // Each student's secret is delivered in their link, outside the hosted file.
      const salt = encoder.encode(`bebras-v2:${student}:${linkToken}`);
      const digest = new Uint8Array(await subtle.digest("SHA-256", salt));
      const locator = Array.from(digest, byte => byte.toString(16).padStart(2, "0")).join("");
      const record = records[locator];
      if (!record) return null;

      const bytes = Uint8Array.from(atob(record), char => char.charCodeAt(0));
      const pin = await subtle.importKey("raw", encoder.encode(verification), "PBKDF2", false, ["deriveKey"]);
      const key = await subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", salt, iterations: 600000 },
        pin, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
      let data;
      try {
        data = await subtle.decrypt({ name: "AES-GCM", iv: bytes.subarray(0, 12) }, key, bytes.subarray(12));
      } catch (error) {
        if (error.name === "OperationError") return null;
        throw error;
      }
      return JSON.parse(new TextDecoder().decode(data));
    }

    if (!subtle) {
      showStatus("보안 연결이 필요합니다. 주소가 https://로 시작하는 페이지에서 열어 주세요.", true);
    } else if (!linkToken) {
      showStatus("선생님에게 받은 개인 조회 링크를 열어 주세요.", true);
    } else {
      submit.disabled = false;
      form.addEventListener("input", clearResult);
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (submit.disabled) return;
      clearResult();

      const student = studentInput.value.trim();
      const verification = verificationInput.value.trim();
      if (!/^[0-9]{4}$/.test(student)) {
        showStatus("학번을 숫자 4자리로 입력하세요.", true);
        studentInput.focus();
        return;
      }
      if (!/^[0-9]{4}$/.test(verification)) {
        showStatus("확인코드를 숫자 4자리로 입력하세요.", true);
        verificationInput.focus();
        return;
      }

      submit.disabled = true;
      studentInput.readOnly = true;
      verificationInput.readOnly = true;
      try {
        const credentials = await lookupCredentials(student, verification);
        if (!credentials) {
          showStatus("개인 링크, 학번, 확인코드를 확인하세요.", true);
          return;
        }

        [examId.textContent, examPassword.textContent] = credentials;
        verificationInput.value = "";
        result.hidden = false;
        showStatus("응시코드를 확인했습니다.");
      } catch {
        showStatus("응시코드를 표시할 수 없습니다. 새로고침한 뒤 다시 시도하세요.", true);
      } finally {
        submit.disabled = false;
        studentInput.readOnly = false;
        verificationInput.readOnly = false;
      }
    });

    document.querySelectorAll("[data-copy]").forEach(button => {
      button.addEventListener("click", async () => {
        const value = document.getElementById(button.dataset.copy).textContent;
        if (!value) return;
        try {
          await navigator.clipboard.writeText(value);
          showStatus("복사했습니다.");
        } catch {
          showStatus("응시코드를 길게 누르거나 드래그해 복사하세요.");
        }
      });
    });

    window.addEventListener("pagehide", () => {
      form.reset();
      clearResult();
    });
    window.addEventListener("hashchange", () => window.location.reload());
  </script>
